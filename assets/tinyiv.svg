        <path d="M 200 372 L 262 262 L 300 316 L 330 288 L 400 372 Z" fill="#4a4a4a"/>
        <path d="M 240 372 L 318 300 L 352 330 L 372 312 L 412 372 Z" fill="#6c6c6c"/>
        <circle cx="342" cy="212" r="26" fill="#ff2d95" opacity="0.55" filter="url(#glow)"/>
