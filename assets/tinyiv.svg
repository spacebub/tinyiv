  <g transform="translate(-121.78 -124.19) scale(1.4851)">
    <ellipse cx="208" cy="256" rx="118" ry="145" fill="url(#haze)"/>
    <g transform="skewX(-9) translate(40 0)" mask="url(#echoMask)">
      <rect x="130" y="136" width="216" height="240" rx="26" fill="none" stroke="#b0b0b0" stroke-width="10" opacity="0.4" filter="url(#blurX)"/>
      <rect x="160" y="136" width="216" height="240" rx="26" fill="none" stroke="#d4d4d4" stroke-width="10" opacity="0.6" filter="url(#blurX)"/>
    </g>
