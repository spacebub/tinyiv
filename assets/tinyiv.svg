      <rect x="128" y="204" width="66" height="5" rx="2.5" fill="url(#streak)" opacity="0.7"/>
      <rect x="76" y="250" width="106" height="7" rx="3.5" fill="url(#streakPink)"/>
      <rect x="138" y="296" width="40" height="5" rx="2.5" fill="url(#streak)" opacity="0.6"/>
      <rect x="105" y="336" width="65" height="6" rx="3" fill="url(#streak)" opacity="0.85"/>
