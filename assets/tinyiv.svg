<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="streakPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d95" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff2d95" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="echoFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#171717" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#171717" stop-opacity="0.3"/>
      <stop offset="0.8" stop-color="#171717" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#171717" stop-opacity="0"/>
    </radialGradient>
    <mask id="echoMask">
      <rect x="100" y="100" width="220" height="320" fill="url(#echoFade)"/>
    </mask>
    <filter id="blurX" x="-20%" y="-10%" width="140%" height="120%">
